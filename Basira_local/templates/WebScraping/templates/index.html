<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basira Web Scraping Local</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+Arabic:wght@300;400;600;700&display=swap" rel="stylesheet"/>
    
    <style>
    /* System fonts — consistent with Basira preprocessor */
    
    :root{
      /* ── Basira palette — matches preprocessor & main app ── */
      --bg:#f0f4f8;--surface:#ffffff;--surface-2:#f8fafc;
      --surface-glass:rgba(255,255,255,0.96);
      --accent:#0ea5e9;--accent-2:#6366f1;
      --accent-dim:rgba(14,165,233,0.09);--accent-glow:rgba(14,165,233,0.18);
      --success:#22c55e;--warning:#f59e0b;--danger:#ef4444;--purple:#8b5cf6;
      --text:#0f172a;--text-2:#334155;--text-dim:#64748b;--text-muted:#94a3b8;
      --border:#e2e8f0;--border-2:#cbd5e1;
      --mono:'JetBrains Mono','Courier New',monospace;
      --sans:'Plus Jakarta Sans','Noto Sans Arabic',system-ui,sans-serif;
      --r:12px;--r-lg:18px;--r-xl:24px;
      --shadow:0 1px 3px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
      --shadow-md:0 4px 16px rgba(0,0,0,.09);
      --shadow-lg:0 12px 40px rgba(0,0,0,.10);
      --tr:.15s ease;
    }
    [data-theme="dark"]{
      --bg:#080e1a;--surface:#111827;--surface-2:#1a2332;
      --surface-glass:rgba(17,24,39,0.92);
      --accent:#38bdf8;--accent-dim:rgba(56,189,248,0.12);--accent-glow:rgba(56,189,248,0.22);
      --text:#f1f5f9;--text-2:#e2e8f0;--text-dim:#94a3b8;--text-muted:#64748b;
      --border:rgba(255,255,255,0.07);--border-2:rgba(255,255,255,0.13);
      --shadow:0 1px 3px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.2);
      --shadow-md:0 4px 20px rgba(0,0,0,.35);--shadow-lg:0 12px 48px rgba(0,0,0,.45);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;outline:none;}
    html{font-size:16px;-webkit-font-smoothing:antialiased;}
    body{font-family:var(--sans);background:var(--bg);color:var(--text);transition:background var(--tr),color var(--tr);}
    
    .bs-nav{
      height:64px;display:flex;align-items:center;justify-content:space-between;
      padding:0 5%;background:var(--surface-glass);backdrop-filter:blur(28px);
      border-bottom:1px solid var(--border);position:sticky;top:0;z-index:1000;gap:16px;
    }
    .bs-brand{font-weight:800;color:var(--accent);font-size:1.45rem;letter-spacing:-1px;font-family:var(--mono);}
    [dir="rtl"] .bs-brand{font-size:1.55rem;letter-spacing:0;font-family:'Noto Sans Arabic',var(--sans);}
    .bs-nav-actions{display:flex;align-items:center;gap:8px;}
    .bs-icon-btn{
      width:36px;height:36px;border-radius:10px;border:1px solid var(--border);
      background:transparent;color:var(--text-dim);cursor:pointer;
      display:flex;align-items:center;justify-content:center;transition:var(--tr);
      font-size:15px;
    }
    .bs-icon-btn:hover{background:var(--accent-dim);color:var(--accent);border-color:var(--accent);}
    
    .bs-page{min-height:calc(100vh - 64px);padding:36px 5% 48px;display:flex;flex-direction:column;gap:24px;}
    
    .bs-card{
      background:var(--surface);border:1px solid var(--border);
      border-radius:var(--r-lg);padding:24px 28px;box-shadow:var(--shadow);
    }
    
    .bs-btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      padding:11px 22px;border-radius:var(--r);font-family:var(--sans);
      font-weight:700;font-size:.9rem;cursor:pointer;
      border:1.5px solid transparent;transition:var(--tr);white-space:nowrap;
    }
    .bs-btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);}
    .bs-btn-primary:hover{filter:brightness(1.08);}
    .bs-btn-primary:active{transform:scale(.98);}
    .bs-btn-ghost{background:var(--surface-2);border-color:var(--border-2);color:var(--text-dim);}
    .bs-btn-ghost:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
    .bs-btn-full{width:100%;}
    
    .bs-input{
      width:100%;padding:12px 16px;border-radius:var(--r);
      background:var(--surface-2);border:1.5px solid var(--border);
      color:var(--text);font-family:var(--sans);font-size:.95rem;transition:var(--tr);
    }
    .bs-input:focus{border-color:var(--accent);}
    .bs-input.error{border-color:var(--danger);}
    .bs-input-sm{padding:10px 14px;font-size:.86rem;}
    
    .bs-error-banner{
      display:flex;align-items:center;gap:10px;
      padding:11px 16px;background:rgba(239,68,68,.07);
      border:1px solid rgba(239,68,68,.22);border-radius:var(--r);
      font-size:.83rem;color:var(--danger);font-weight:600;
    }
    
    .bs-section-title{
      font-size:.72rem;font-weight:800;color:var(--text-muted);
      letter-spacing:1.2px;text-transform:uppercase;margin-bottom:12px;
    }
    
    .bs-spinner{
      width:56px;height:56px;border-radius:50%;
      border:3px solid var(--border);border-top-color:var(--accent);
      animation:bs-spin 1s linear infinite;margin:0 auto;
    }
    @keyframes bs-spin{to{transform:rotate(360deg)}}
    
    .bs-loading-box{
      flex:1;display:flex;align-items:center;justify-content:center;min-height:400px;
    }
    .bs-loading-inner{text-align:center;max-width:420px;padding:48px 24px;}
    .bs-loading-title{font-size:1.3rem;font-weight:800;color:var(--text);margin-bottom:10px;}
    .bs-loading-sub{font-size:.86rem;color:var(--text-dim);line-height:1.7;}
    
    .bs-results-layout{display:flex;flex:1;overflow:hidden;height:calc(100vh - 64px);}
    .bs-sidebar{
      width:220px;min-width:220px;background:var(--surface);
      border-inline-end:1px solid var(--border);
      padding:20px 16px;display:flex;flex-direction:column;gap:18px;overflow-y:auto;
    }
    .bs-results-main{flex:1;overflow:auto;padding:24px 28px;}
    
    .bs-stat-row{
      display:flex;justify-content:space-between;align-items:center;
      padding:9px 12px;background:var(--surface-2);
      border-radius:10px;border:1px solid var(--border);
    }
    .bs-stat-label{font-size:.75rem;color:var(--text-dim);}
    .bs-stat-value{font-size:.88rem;font-weight:800;font-family:var(--mono);}
    
    .bs-field-chip{
      padding:8px 12px;background:var(--surface-2);border-radius:10px;
      border:1px solid var(--border);font-size:.78rem;color:var(--text);
      display:flex;align-items:center;gap:8px;
    }
    
    .bs-search-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
    .bs-count-badge{font-size:.75rem;color:var(--text-muted);font-family:var(--mono);flex-shrink:0;}
    
    .bs-table-wrap{border-radius:var(--r-lg);border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow);}
    .bs-table{width:100%;border-collapse:collapse;font-size:.8rem;}
    .bs-table th{
      color:var(--accent);text-align:start;padding:11px 14px;
      border-bottom:2px solid var(--border);font-family:var(--mono);font-size:.72rem;
      background:var(--accent-dim);white-space:nowrap;cursor:pointer;user-select:none;
    }
    .bs-table th:hover{background:var(--accent-glow);}
    .bs-table td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
    .bs-table tr:hover td{background:var(--accent-dim);}
    .bs-table tr:last-child td{border-bottom:none;}
    .bs-empty{padding:40px;text-align:center;color:var(--text-muted);font-size:.86rem;}
    
    .bs-tabs{display:flex;gap:8px;border-bottom:2px solid var(--border);margin-bottom:20px;}
    .bs-tab{
      padding:10px 20px;background:transparent;border:none;
      color:var(--text-dim);font-weight:700;font-size:.85rem;
      cursor:pointer;position:relative;transition:var(--tr);
    }
    .bs-tab:hover{color:var(--accent);}
    .bs-tab.active{color:var(--accent);}
    .bs-tab.active::after{
      content:'';position:absolute;bottom:-2px;left:0;right:0;
      height:2px;background:var(--accent);
    }
    
    .bs-field-builder{display:flex;flex-direction:column;gap:10px;margin-top:12px;}
    .bs-field-row{
      display:flex;gap:10px;align-items:center;
      padding:12px;background:var(--surface-2);border-radius:var(--r);
      border:1px solid var(--border);
    }
    .bs-field-row input,.bs-field-row select{flex:1;}
    .bs-field-remove{
      width:32px;height:32px;border-radius:8px;
      background:rgba(239,68,68,.1);color:var(--danger);
      border:1px solid rgba(239,68,68,.2);cursor:pointer;
      display:flex;align-items:center;justify-content:center;
    }
    
    .bs-toggle{
      width:42px;height:24px;border-radius:99px;cursor:pointer;
      position:relative;transition:background var(--tr);flex-shrink:0;border:none;
    }
    .bs-toggle-thumb{
      position:absolute;top:3px;width:18px;height:18px;
      border-radius:50%;background:white;transition:left var(--tr);
    }
    
    .bs-suggestions{
      display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
      gap:10px;margin-top:12px;
    }
    .bs-suggestion-card{
      background:var(--surface-2);border:1px solid var(--border);
      border-radius:var(--r);padding:12px;cursor:pointer;transition:var(--tr);
    }
    .bs-suggestion-card:hover{border-color:var(--accent);background:var(--accent-dim);}
    .bs-suggestion-selector{
      font-family:var(--mono);font-size:.72rem;color:var(--accent);
      font-weight:700;margin-bottom:6px;
    }
    .bs-suggestion-sample{font-size:.7rem;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;}
    .bs-suggestion-count{font-size:.65rem;color:var(--text-muted);margin-top:4px;}
    
    ::-webkit-scrollbar{width:5px;height:5px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:10px;}
    ::-webkit-scrollbar-thumb:hover{background:var(--accent);}
    


    .bs-hero{
      position:relative;overflow:hidden;border:1px solid var(--border);
      background:linear-gradient(135deg,var(--surface),var(--surface-2));
      border-radius:var(--r-xl);padding:28px;box-shadow:var(--shadow-md);
    }
    .bs-hero::after{
      content:'';position:absolute;inset:auto -80px -120px auto;width:320px;height:320px;
      background:radial-gradient(circle,var(--accent-glow),transparent 68%);pointer-events:none;
    }
    .bs-kicker{font-size:.72rem;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
    .bs-grid-2{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start;}
    .bs-grid-visual{display:block;}
    .bs-panel-visual{padding:0;}

    .bs-modal-backdrop{position:fixed;inset:0;background:rgba(2,6,23,.72);backdrop-filter:blur(10px);z-index:5000;display:flex;align-items:center;justify-content:center;padding:24px;}
    .bs-modal{width:min(1100px,96vw);max-height:90vh;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-lg);overflow:hidden;display:flex;flex-direction:column;}
    .bs-modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border);background:var(--surface-2);}
    .bs-modal-title{font-weight:900;color:var(--text);}
    .bs-modal-body{padding:18px;overflow:auto;}
    .bs-visual-shell{
      position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;gap:8px;
      height:100dvh;width:100vw;padding:8px;background:var(--bg);overflow:hidden;
    }
    .bs-visual-topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;min-height:44px;flex:0 0 auto;}
    .bs-visual-main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:8px;min-height:0;flex:1;width:100%;}
    .bs-visual-framebox{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--border);height:calc(100dvh - 68px);min-height:0;background:white;}
    .bs-visual-side{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:10px;overflow:auto;height:calc(100dvh - 68px);min-width:0;}
    .bs-grid-2.bs-grid-visual{max-width:none!important;width:100vw!important;margin:0!important;}
    .bs-panel.bs-panel-visual{width:100vw!important;height:100dvh!important;}
    .bs-page:has(.bs-visual-shell){padding:0!important;gap:0!important;min-height:100dvh!important;overflow:hidden!important;}
    @media (max-width:1100px){.bs-visual-main{grid-template-columns:minmax(0,1fr) 280px}.bs-visual-side{height:calc(100dvh - 68px)}.bs-visual-framebox{height:calc(100dvh - 68px);min-height:0}}
    @media (max-width:760px){.bs-visual-main{grid-template-columns:1fr}.bs-visual-side{position:absolute;right:8px;top:60px;width:min(320px,calc(100vw - 16px));max-height:45dvh;box-shadow:var(--shadow-lg)}.bs-visual-framebox{height:calc(100dvh - 68px);}}
    .bs-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);}
    .bs-panel-title{font-size:1rem;font-weight:900;margin-bottom:4px;color:var(--text);}
    .bs-panel-sub{font-size:.78rem;color:var(--text-dim);line-height:1.6;margin-bottom:14px;}
    .bs-help-list{display:flex;flex-direction:column;gap:10px;}
    .bs-help-card{padding:12px 13px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);line-height:1.55;}
    .bs-help-title{font-weight:800;font-size:.82rem;color:var(--text);margin-bottom:3px;}
    .bs-help-text{font-size:.74rem;color:var(--text-dim);}
    .bs-option-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
    .bs-option-card{padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);}
    .bs-toggle-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;background:var(--surface-2);border-radius:var(--r);border:1px solid var(--border);}
    .bs-inline-note{padding:10px 12px;background:var(--accent-dim);border:1px solid var(--border);border-radius:var(--r);font-size:.76rem;color:var(--text-dim);line-height:1.55;}
    .bs-warning-note{padding:10px 12px;background:rgba(245,158,11,.10);border:1px solid rgba(245,158,11,.24);border-radius:var(--r);font-size:.76rem;color:var(--text);line-height:1.55;}
    .bs-danger-note{padding:12px 14px;background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.28);border-radius:var(--r);font-size:.8rem;color:var(--text);line-height:1.6;}
    .bs-file-input{font-size:.78rem;color:var(--text-dim);}
    .bs-file-input::file-selector-button{margin-inline-end:10px;border:1px solid var(--border-2);border-radius:10px;background:var(--surface-2);color:var(--text);padding:8px 12px;font-weight:800;cursor:pointer;}
    .bs-btn:disabled{opacity:.55;cursor:not-allowed;filter:none;}
    .bs-input[readonly]{opacity:.86;}



    /* Basira professional workflow redesign */
    .bs-tabs{display:none;}
    .bs-panel{padding:0;background:transparent;border:0;box-shadow:none;}
    .bs-grid-2{display:block;max-width:1180px;margin:0 auto;}
    .bs-workflow-card{background:var(--surface);border:1px solid var(--border);border-radius:28px;box-shadow:var(--shadow-lg);overflow:hidden;}
    .bs-workflow-head{padding:24px 26px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,var(--surface),var(--surface-2));display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;}
    .bs-workflow-title{font-size:1.35rem;font-weight:950;letter-spacing:-.04em;color:var(--text);}
    .bs-workflow-sub{font-size:.84rem;color:var(--text-dim);margin-top:5px;line-height:1.6;max-width:720px;}
    .bs-stepper{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
    .bs-step-pill{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--text-dim);font-size:.75rem;font-weight:850;}
    .bs-step-pill.active{border-color:var(--accent);background:var(--accent-dim);color:var(--accent);}
    .bs-step-num{width:22px;height:22px;border-radius:999px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--mono);font-size:.7rem;color:var(--text-dim);}
    .bs-step-pill.active .bs-step-num{background:var(--accent);color:#fff;}
    .bs-workflow-body{padding:26px;display:flex;flex-direction:column;gap:18px;}
    .bs-url-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;}
    .bs-clean-card{background:var(--surface-2);border:1px solid var(--border);border-radius:22px;padding:18px;}
    .bs-clean-title{font-size:.95rem;font-weight:900;margin-bottom:5px;color:var(--text);}
    .bs-clean-desc{font-size:.78rem;color:var(--text-dim);line-height:1.6;}
    .bs-action-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
    .bs-detected-card{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;background:linear-gradient(135deg,var(--accent-dim),transparent);border:1px solid var(--border);border-radius:22px;padding:18px;}
    .bs-detected-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}

    .bs-detect-success{margin-top:12px;padding:10px 12px;border:1px solid rgba(34,197,94,.28);background:rgba(34,197,94,.10);border-radius:14px;color:#22c55e;font-weight:850;font-size:.86rem;line-height:1.55;}
    .bs-detect-panel{margin-top:14px;border:1px solid rgba(56,189,248,.25);background:rgba(56,189,248,.08);border-radius:18px;padding:16px;display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;}
    .bs-detect-label{font-size:1.05rem;font-weight:950;color:var(--text);margin-bottom:6px;}
    .bs-detect-sub{font-size:.86rem;color:var(--text-dim);line-height:1.6;}
    .bs-detect-sub code{color:#7dd3fc;background:rgba(15,23,42,.55);border:1px solid var(--border);border-radius:10px;padding:3px 7px;}
    .bs-detect-fields{display:flex;gap:8px;flex-wrap:wrap;max-width:520px;}

    .bs-chip{padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:.72rem;font-weight:800;color:var(--text-2);}
    .bs-advanced-box{border:1px solid var(--border);border-radius:22px;background:var(--surface-2);overflow:hidden;}
    .bs-advanced-box summary{cursor:pointer;list-style:none;padding:16px 18px;font-weight:900;display:flex;justify-content:space-between;align-items:center;color:var(--text);}
    .bs-advanced-box summary::-webkit-details-marker{display:none;}
    .bs-advanced-body{padding:0 18px 18px;display:flex;flex-direction:column;gap:14px;}
    .bs-advanced-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
    .bs-field-row{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:10px;}
    .bs-mini-note{font-size:.75rem;color:var(--text-dim);line-height:1.6;}
    .bs-primary-footer{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 26px;border-top:1px solid var(--border);background:var(--surface-2);}
    .bs-visual-shell{background:var(--surface);border:0;border-radius:0;box-shadow:none;overflow:hidden;}
    @media(max-width:860px){.bs-url-row{grid-template-columns:1fr;}.bs-detected-card{grid-template-columns:1fr;}.bs-advanced-grid{grid-template-columns:1fr;}.bs-workflow-head,.bs-workflow-body,.bs-primary-footer{padding:18px;}}

    @media(max-width:920px){
      .bs-grid-2{grid-template-columns:1fr;}
      .bs-option-grid{grid-template-columns:1fr;}
      .bs-field-row{flex-direction:column;align-items:stretch;}
    }
    @media(max-width:640px){
      .bs-page{padding:20px 4% 32px;}
    }
      @keyframes bs-scan {
        0%  { opacity:0; top:40px; }
        10% { opacity:1; }
        90% { opacity:1; }
        100%{ opacity:0; top:100%; }
      }
    </style>
</head>
<body>
    <div id="app"></div>
    
    <script>
    const T = {
      en: {
        brand: 'Basira',
        backLabel: 'Back',
        subtitle: 'Extract structured data from websites',
        tabs: {
          scrape: 'Structured Data',
          links: 'Link Scraping',
          test: 'Test Selector',
          analyze: 'Analyze Page',
          visual: 'Visual Helper'
        },
        url: 'Website URL',
        urlPlaceholder: 'https://example.com',
        containerSelector: 'Container Selector (optional)',
        itemSelector: 'Item Selector',
        fields: 'Data Fields',
        addField: 'Add Field',
        fieldName: 'Field Name',
        fieldSelector: 'CSS Selector',
        dataType: 'Data Type',
        maxRows: 'Max Rows',
        startScrape: 'Start Scraping',
        back: 'New Scrape',
        loading: 'Loading',

    class BasiraApp {

        document.documentElement.setAttribute('data-theme', initialTheme);
        this.state = {

            trimSpaces: true,
            removeDuplicates: false,
            removeEmptyRows: true,
            normalizePrices: false,
            absoluteLinks: true
          },
        };
        
        this.render();

        // Bridge used by the same-origin visual preview iframe.
        window.basiraVisualBridge = (message) => {
          if (!message || message.source !== 'basira-visual') return;
          if (message.action === 'add-field') this.addVisualSelection(message.payload);
          if (message.action === 'set-container') this.handleIframeSelector(message.selector, 'container');
          if (message.action === 'set-item') this.handleIframeSelector(message.selector, 'item');
        };

        window.addEventListener('message', (event) => {
          const message = event.data || {};
          if (!message || message.source !== 'basira-visual') return;
          window.basiraVisualBridge(message);
        });
      }
      
      get t() {
        return T[this.state.lang];
      }
      
      get isAR() {
        return this.state.lang === 'ar';
      }
      
      setState(updates) {
        const keys = Object.keys(updates || {});
        const visualOnlyUpdate = this.state.visualMode && keys.length > 0 && keys.every(k => k === 'visualSelections');
        this.state = {...this.state, ...updates};
        if (visualOnlyUpdate) {
          this.renderVisualSidePanel();
          this.syncVisualFieldHighlights();
          return;
        }
        this.render();
      }

      renderVisualSidePanel() {
        const side = document.getElementById('basira-visual-side');
        if (!side) return;
        side.innerHTML = this.renderVisualSideContent();
        const count = document.getElementById('basira-visual-field-count');
        if (count) count.textContent = 'Fields: ' + ((this.state.visualSelections || []).length);
        this.fixFormAccessibility();
      }

      syncVisualFieldHighlights() {
        const iframe = document.getElementById('basira-visual-frame');
        if (!iframe || !iframe.contentWindow) return;
        try {
          const iframeDoc = iframe.contentWindow.document;
          iframeDoc.querySelectorAll('.basira-visual-field').forEach(el => el.classList.remove('basira-visual-field'));
          (this.state.visualSelections || []).forEach(item => {
            let el = null;
            if (item.visualId) {
              el = iframeDoc.querySelector('[data-basira-visual-id="' + String(item.visualId).replace(/"/g, '\\"') + '"]');
            }
            if (!el && item.selector) {
              try { el = iframeDoc.querySelector(item.selector); } catch (_) {}
            }
            if (el && el.classList) el.classList.add('basira-visual-field');
          });
        } catch (_) {}
      }

        const selected = this.state.visualSelections || [];

                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;">

                  <button type="button" class="bs-btn bs-btn-ghost" onclick="app.clearVisualSelections()" style="padding:6px 9px;font-size:.72rem;">Clear</button>
                </div>

                      <div style="font-family:var(--mono);font-size:.68rem;color:var(--accent);word-break:break-all;line-height:1.5;">${item.selector}</div>

                    <div style="display:grid;grid-template-columns:1fr 110px;gap:8px;">

                      <label style="display:none;" for="visual-field-type-${index}">Field type</label><select id="visual-field-type-${index}" name="visual-field-type-${index}" class="bs-input bs-input-sm" onchange="app.updateVisualSelection(${index}, 'type', event.target.value)">
                        <option value="text" ${item.type === 'text' ? 'selected' : ''}>text</option>
                        <option value="link" ${item.type === 'link' ? 'selected' : ''}>link</option>
                        <option value="image" ${item.type === 'image' ? 'selected' : ''}>image</option>

                  </div>
                `}

                <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px;">
                  <button type="button" class="bs-btn bs-btn-primary bs-btn-full" onclick="app.applyVisualSelectionsToFields()">Apply selected fields</button>
                  <button type="button" class="bs-btn bs-btn-ghost bs-btn-full" onclick="app.closeVisualMode()">Back</button>
                </div>
        `;
      }

      setStateDraft(key, value) {
        this.state[key] = value;
      }

      loadJobHistory() {
        try { return JSON.parse(localStorage.getItem('basiraJobHistory') || '[]'); }
        catch (_) { return []; }
      }

      saveJobHistory(entry) {
        const history = [entry, ...this.loadJobHistory()].slice(0, 10);
        localStorage.setItem('basiraJobHistory', JSON.stringify(history));
        this.state.jobHistory = history;
      }

      validateUrlInput(value) {
        const text = String(value || '').trim();
        if (!text) return false;
        return /^(https?:\/\/)?[^\s]+\.[^\s]+/i.test(text);
      }

      showFriendlyError(raw) {
        const explained = this.explainBackendError(raw);
        this.showError(explained.title, explained.message, explained.details);
      }

      showError(title, message, details) {
        this.setState({
          lastError: {title: title || 'Error', message: message || '', details: details || ''},
          currentView: 'home'
        });
      }

      clearError() {
        this.setState({lastError: null});
      }

      explainBackendError(raw) {
        const text = String(raw || 'Unknown error');
        if (text.includes('requests-only')) {
          return {
            title: 'Option unavailable',
            message: 'This option is unavailable for this page.',
            details: 'Please use another loading option or check the page settings.'
          };
        }
        if (text.includes('No items found with selector')) {
          return {
            title: 'No repeated items found',
            message: 'The Item Selector does not match products or repeated cards on this page.',
            details: 'Click Auto Detect, or leave Item Selector empty and start scraping. Basira will try to detect it automatically.'
          };
        }
        if (text.includes('Failed to fetch page') || text.includes('403') || text.includes('Access Denied')) {
          return {
            title: 'The website blocked or rejected the request',
            message: 'Some websites block simple HTTP requests or require JavaScript rendering.',
            details: 'Try reducing pages, checking selectors, or enabling Proxy Settings with a valid proxy URL.'
          };
        }
        return {title: 'Scraping failed', message: text, details: 'Review the URL, selectors, pagination settings, proxy, and browser options.'};
      }
      
      toggleLang() {
        const newLang = this.state.lang === 'en' ? 'ar' : 'en';
        this.setState({lang: newLang});
        document.documentElement.setAttribute('lang', newLang);
        document.documentElement.setAttribute('dir', newLang === 'ar' ? 'rtl' : 'ltr');
        try { localStorage.setItem('basira_lang', newLang); } catch(e) {}
      }
      
      toggleTheme() {
        const newTheme = this.state.theme === 'dark' ? 'light' : 'dark';
        this.setState({theme: newTheme});
        document.documentElement.setAttribute('data-theme', newTheme);
        try { localStorage.setItem('basira_theme', newTheme); } catch(e) {}
      }
      
      addField() {
        this.setState({
          fields: [...this.state.fields, {name: '', selector: '', type: 'text'}]
        });
      }
      
      removeField(index) {
        const fields = this.state.fields.filter((_, i) => i !== index);
        this.setState({fields: fields.length > 0 ? fields : [{name: '', selector: '', type: 'text'}]});
      }
      
      updateField(index, key, value) {
        const fields = [...this.state.fields];
        if (!fields[index]) return;
        fields[index] = {...fields[index], [key]: value};
        this.setState({fields});
      }

      updateFieldDraft(index, key, value) {
        const fields = [...this.state.fields];
        if (!fields[index]) return;
        fields[index] = {...fields[index], [key]: value};
        this.state.fields = fields;
      }

      async importUrlsFile(input) {
        const file = input && input.files && input.files[0];
        if (!file) return;
        const text = await file.text();
        const urls = text
          .split(/[\n,;]+/)
          .map(x => x.trim())
          .filter(Boolean)
          .map(x => /^https?:\/\//i.test(x) ? x : 'https://' + x);
        const websites = urls.map((url, index) => ({
          ...this.createEmptyWebsite(index + 1),
          url
        }));
        this.setState({multiMode: true, websites: websites.length ? websites : this.ensureWebsites()});
      }

      async autoDetectScrapeConfig(preserveUserFields = false) {
        const {url} = this.state;
        if (!url) {
          app.showToast(app.isAR ? 'أدخل رابط الموقع أولاً.' : 'Please enter the website URL first.', 'warning');
          return false;
        }
        this.setState({autoDetecting: true, autoDetectNote: 'Detecting repeated items and fields...', detectedSummary: null});
        try {
          const response = await fetch('/api/auto-detect', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({url, proxyEnabled: this.state.proxyEnabled, proxyUrl: this.state.proxyUrl})
          });
          const data = await response.json();
          if (!data.success) {
            this.setState({autoDetecting: false, autoDetectNote: '', detectedSummary: null});
            this.showFriendlyError(data.error);
            return false;
          }
          const fieldNames = (data.fieldNames || (data.fields || []).map(f => f.name)).filter(Boolean);
          const detectedSummary = {
            group: data.detectedGroup || 'Repeated items',
            itemSelector: data.itemSelector || '',
            itemSelectorLabel: data.itemSelectorLabel || data.itemSelector || '',
            itemCount: data.itemCount || 0,
            fields: fieldNames,
            paginationSelector: data.paginationSelector || ''
          };
          const nextState = {
            containerSelector: data.containerSelector || this.state.containerSelector || '',
            itemSelector: data.itemSelector || this.state.itemSelector || '',
            paginationSelector: data.paginationSelector || this.state.paginationSelector,
            autoDetecting: false,
            detectedSummary,
            autoDetectNote: `Detected: ${detectedSummary.group}. ${detectedSummary.itemCount} items found.`
          };
          if (!preserveUserFields) {
            nextState.fields = (data.fields && data.fields.length) ? data.fields : this.state.fields;
          }
          this.setState(nextState);
          return true;
        } catch (e) {
          this.setState({autoDetecting: false, autoDetectNote: '', detectedSummary: null});
          this.showFriendlyError(e.message);
          return false;
        }
      }

      async previewScrape() {
        const previousMaxRows = this.state.maxRows;
        this.state.previewMode = true;
        this.state.maxRows = 5;
        await this.startScrape(true);
        this.state.maxRows = previousMaxRows;
        this.state.previewMode = false;
      }

      closePreviewModal() {
        this.setState({previewModal: null, previewModalLoading: false});
      }

      async startScrape(isPreview = false) {
        let {url, multiMode, containerSelector, itemSelector, fields, maxRows, scrollEnabled, maxPages, paginationSelector, proxyEnabled, proxyUrl, renderEnabled, loadMoreEnabled, loadMoreSelector, maxLoadMoreClicks, waitAfterLoad} = this.state;
        if (multiMode) {
          await this.startMultiScrape();
          return;
        }
        
        if (!this.validateUrlInput(url)) {
          this.showError('Invalid URL', 'Enter a valid website URL before scraping.', 'Example: https://books.toscrape.com');
          return;
        }
        
        const hasUserFields = fields.some(f => f.name && f.selector);
        if (!itemSelector || !hasUserFields) {
          const ok = await this.autoDetectScrapeConfig(hasUserFields);
          if (!ok) return;
          ({url, containerSelector, itemSelector, fields, maxRows, scrollEnabled, maxPages, paginationSelector, proxyEnabled, proxyUrl, renderEnabled, loadMoreEnabled, loadMoreSelector, maxLoadMoreClicks, waitAfterLoad} = this.state);
        }
        
        if (isPreview) {
          this.setState({previewModalLoading: true, previewModal: null, previewMode: true});
        } else {
          this.setState({currentView: 'loading', previewMode: false});
        }
        
        try {
          const response = await fetch('/api/scrape', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
              url,
              containerSelector,
              itemSelector,
              fields: fields.filter(f => f.name),
              maxRows,
              scrollEnabled,
              maxPages,
              paginationSelector,
              proxyEnabled,
              proxyUrl,
              renderEnabled: false,
              loadMoreEnabled: false,
              loadMoreSelector: '',
              maxLoadMoreClicks: 0,
              waitAfterLoad
            })
          });
          
          const data = await response.json();
          
          if (data.success) {
            const finalFields = (data.fieldsUsed && data.fieldsUsed.length) ? data.fieldsUsed : fields.filter(f => f.name && f.selector);
            const resultObject = {
              data: data.data,
              fields: finalFields,
              stats: data.stats,
              failed: data.failed,
              isPreview: isPreview
            };
            this.saveJobHistory({type: isPreview ? 'preview' : 'single', url, rows: data.data.length, at: new Date().toLocaleString()});
            if (isPreview) {
              this.setState({
                currentView: 'home',
                previewModal: resultObject,
                previewModalLoading: false,
                previewMode: false
              });
            } else {
              this.setState({
                currentView: 'results',
                results: resultObject,
                previewModalLoading: false,
                previewMode: false
              });
            }
          } else {
            this.state.previewModalLoading = false;
            this.showFriendlyError(data.error);
          }
        } catch (e) {
          this.state.previewModalLoading = false;
          this.showFriendlyError(e.message);
        }
      }
      
      createEmptyWebsite(index = 1) {
        return {
          name: 'Website ' + index,
          url: '',
          containerSelector: '',
          itemSelector: '',
          fields: [{name: '', selector: '', type: 'text'}],
          maxRows: 100,
          maxPages: 1,
          paginationSelector: ''
        };
      }

      ensureWebsites() {
        if (Array.isArray(this.state.websites) && this.state.websites.length) return this.state.websites;
        const first = this.createEmptyWebsite(1);
        first.url = this.state.url || '';
        first.containerSelector = this.state.containerSelector || '';
        first.itemSelector = this.state.itemSelector || '';
        first.fields = (this.state.fields && this.state.fields.length) ? JSON.parse(JSON.stringify(this.state.fields)) : [{name: '', selector: '', type: 'text'}];
        first.maxRows = this.state.maxRows || 100;
        first.maxPages = this.state.maxPages || 1;
        first.paginationSelector = this.state.paginationSelector || '';
        this.state.websites = [first];
        return this.state.websites;
      }

      addWebsite() {
        const websites = [...this.ensureWebsites(), this.createEmptyWebsite(this.ensureWebsites().length + 1)];
        this.setState({websites});
      }

      removeWebsite(index) {
        const websites = this.ensureWebsites().filter((_, i) => i !== index);
        this.setState({websites: websites.length ? websites : [this.createEmptyWebsite(1)]});
      }

      updateWebsiteDraft(index, key, value) {
        const websites = this.ensureWebsites();
        if (!websites[index]) return;
        websites[index][key] = value;
      }

      updateWebsite(index, key, value) {
        const websites = [...this.ensureWebsites()];
        if (!websites[index]) return;
        websites[index] = {...websites[index], [key]: value};
        this.setState({websites});
      }

      addWebsiteField(siteIndex) {
        const websites = [...this.ensureWebsites()];
        if (!websites[siteIndex]) return;
        const fields = [...(websites[siteIndex].fields || [])];
        fields.push({name: '', selector: '', type: 'text'});
        websites[siteIndex] = {...websites[siteIndex], fields};
        this.setState({websites});
      }

      removeWebsiteField(siteIndex, fieldIndex) {
        const websites = [...this.ensureWebsites()];
        if (!websites[siteIndex]) return;
        const fields = (websites[siteIndex].fields || []).filter((_, i) => i !== fieldIndex);
        websites[siteIndex] = {...websites[siteIndex], fields: fields.length ? fields : [{name: '', selector: '', type: 'text'}]};
        this.setState({websites});
      }

      updateWebsiteFieldDraft(siteIndex, fieldIndex, key, value) {
        const websites = this.ensureWebsites();
        if (!websites[siteIndex] || !websites[siteIndex].fields || !websites[siteIndex].fields[fieldIndex]) return;
        websites[siteIndex].fields[fieldIndex][key] = value;
      }

      updateWebsiteField(siteIndex, fieldIndex, key, value) {
        const websites = [...this.ensureWebsites()];
        if (!websites[siteIndex] || !websites[siteIndex].fields || !websites[siteIndex].fields[fieldIndex]) return;
        const fields = [...websites[siteIndex].fields];
        fields[fieldIndex] = {...fields[fieldIndex], [key]: value};
        websites[siteIndex] = {...websites[siteIndex], fields};
        this.setState({websites});
      }

      copyMainSettingsToWebsite(index) {
        const websites = [...this.ensureWebsites()];
        if (!websites[index]) return;
        websites[index] = {
          ...websites[index],
          url: websites[index].url || this.state.url || '',
          containerSelector: this.state.containerSelector || '',
          itemSelector: this.state.itemSelector || '',
          fields: JSON.parse(JSON.stringify((this.state.fields && this.state.fields.length) ? this.state.fields : [{name: '', selector: '', type: 'text'}])),
          maxRows: this.state.maxRows || 100,
          maxPages: this.state.maxPages || 1,
          paginationSelector: this.state.paginationSelector || ''
        };
        this.setState({websites});
      }

      async autoDetectWebsiteConfig(index) {
        const websites = [...this.ensureWebsites()];
        const site = websites[index];
        if (!site || !site.url) {
          app.showToast(app.isAR ? 'أدخل رابط الموقع أولاً.' : 'Enter the website URL first.', 'warning');
          return;
        }
        const cleanedUrl = /^https?:\/\//i.test(site.url) ? site.url : 'https://' + site.url;
        try {
          const response = await fetch('/api/auto-detect', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({url: cleanedUrl, proxyEnabled: this.state.proxyEnabled, proxyUrl: this.state.proxyUrl})
          });
          const data = await response.json();
          if (!data.success) {
            this.showFriendlyError(data.error);
            return;
          }
          websites[index] = {
            ...site,
            url: cleanedUrl,
            containerSelector: data.containerSelector || site.containerSelector || '',
            itemSelector: data.itemSelector || site.itemSelector || '',
            fields: (data.fields && data.fields.length) ? data.fields : site.fields,
            paginationSelector: data.paginationSelector || site.paginationSelector || ''
          };
          this.setState({websites});
        } catch (e) {
          this.showFriendlyError(e.message);
        }
      }

      async previewWebsite(index) {
        const websites = this.ensureWebsites();
        const site = websites[index];

            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
              url: cleanedUrl,
              containerSelector: site.containerSelector || '',
              itemSelector: site.itemSelector || '',
              fields: (site.fields || []).filter(f => f.name && f.selector),
              maxRows: 5,

            },

      async startMultiScrape() {
        const websites = this.ensureWebsites().map((site, index) => ({
          name: site.name || ('Website ' + (index + 1)),
          url: /^https?:\/\//i.test(site.url || '') ? site.url : 'https://' + (site.url || ''),
          containerSelector: site.containerSelector || '',
          itemSelector: site.itemSelector || '',
          fields: (site.fields || []).filter(f => f.name && f.selector),
          maxRows: parseInt(site.maxRows || 100),
          maxPages: parseInt(site.maxPages || 1),
          paginationSelector: site.paginationSelector || ''
        })).filter(site => site.url && site.url !== 'https://');

        if (!websites.length) {
          this.showError('No websites', 'Add at least one website URL.', 'Each website can have its own selectors and fields.');
          return;
        }
        const invalid = websites.find(site => !this.validateUrlInput(site.url));
        if (invalid) {
          this.showError('Invalid URL', 'One of the website URLs is invalid.', invalid.url);
          return;
        }
        this.setState({currentView: 'loading'});
        try {
          const response = await fetch('/api/multi-scrape', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
              websites,
              proxyEnabled: this.state.proxyEnabled,
              proxyUrl: this.state.proxyUrl,
              renderEnabled: false,
              loadMoreEnabled: false
            })
          });
          const data = await response.json();
          if (data.success) {
            this.saveJobHistory({type: 'multi-site', url: `${(data.datasets || []).length} websites`, rows: data.stats ? data.stats.total_items : 0, at: new Date().toLocaleString()});
            this.setState({
              currentView: 'results',
              selectedDatasetIndex: 0,
              results: {
                datasets: data.datasets,
                data: (data.datasets[0] && data.datasets[0].data) || [],
                fields: (data.datasets[0] && data.datasets[0].fields) || [],
                stats: data.stats,
                errors: data.errors || [],
                isMulti: true
              }
            });
          } else {
            this.state.previewModalLoading = false;
            this.showFriendlyError(data.error || 'Scraping failed');
          }
        } catch (e) {
          this.state.previewModalLoading = false;
          this.showFriendlyError(e.message);
        }
      }

      getExportBaseUrl(dataset = null) {
        const raw = (dataset && (dataset.url || dataset.name)) || this.state.url || '';
        if (!raw) return '';
        return /^https?:\/\//i.test(raw) ? raw : 'https://' + raw;
      }

      normalizePriceValue(value) {
        const raw = String(value ?? '').trim();
        if (!raw) return '';
        const currencyMatch = raw.match(/(SAR|ريال|ر\.س|[$£€¥])/i);
        const numberMatch = raw.replace(/,/g, '').match(/-?\d+(?:\.\d+)?/);
        if (!numberMatch) return raw.replace(/\s+/g, ' ');
        const number = numberMatch[0];
        const currency = currencyMatch ? currencyMatch[0].toUpperCase().replace('ر.س', 'SAR').replace('ريال', 'SAR') : '';
        return currency ? `${number} ${currency}` : number;
      }

      absolutizeValue(value, baseUrl) {
        const text = String(value ?? '').trim();
        if (!text || !baseUrl) return text;
        if (/^(https?:|mailto:|tel:|data:|#)/i.test(text)) return text;
        if (/^(\/|\.\/|\.\.\/|[A-Za-z0-9_-]+\/)/.test(text)) {
          try { return new URL(text, baseUrl).href; } catch (_) { return text; }
        }
        return text;
      }

      cleanRowsForExport(rows, fields, baseUrl) {
        const options = this.state.exportCleanOptions || {};
        const fieldNames = (fields || []).map(f => f.name);
        let cleaned = (rows || []).map(row => {
          const out = {};
          (fields || []).forEach(f => {
            let value = row ? row[f.name] : '';
            if (options.trimSpaces && typeof value === 'string') value = value.replace(/\s+/g, ' ').trim();
            if (options.normalizePrices && (f.type === 'price' || /price|السعر|سعر/i.test(f.name || ''))) value = this.normalizePriceValue(value);
            if (options.absoluteLinks && (f.type === 'link' || f.type === 'image' || /url|link|href|src|image|رابط|صورة/i.test(f.name || ''))) value = this.absolutizeValue(value, baseUrl);
            out[f.name] = value ?? '';
          });
          return out;
        });
        if (options.removeEmptyRows) {
          cleaned = cleaned.filter(row => fieldNames.some(name => String(row[name] ?? '').trim() !== ''));
        }
        if (options.removeDuplicates) {
          const seen = new Set();
          cleaned = cleaned.filter(row => {
            const key = JSON.stringify(fieldNames.map(name => String(row[name] ?? '').trim().toLowerCase()));
            if (seen.has(key)) return false;
            seen.add(key);
            return true;
          });
        }
        return cleaned;
      }

      buildExportPayload() {
        const {results} = this.state;
        if (!results) return null;
        if (results.datasets && results.datasets.length) {
          const datasets = results.datasets.map(dataset => {
            const fields = dataset.fields || results.fields || [];
            const data = this.cleanRowsForExport(dataset.data || [], fields, this.getExportBaseUrl(dataset));
            return {...dataset, data, fields};
          });
          return {
            rows: datasets[0] ? datasets[0].data : [],
            fields: datasets[0] ? datasets[0].fields : (results.fields || []),
            datasets
          };
        }
        const fields = results.fields || [];
        const rows = this.cleanRowsForExport(results.data || [], fields, this.getExportBaseUrl());
        return {rows, fields, datasets: null};
      }

      openExportPreview() {
        const payload = this.buildExportPayload();
        if (!payload) return;
        const allRows = payload.datasets ? payload.datasets.flatMap(d => d.data || []) : payload.rows;
        const originalRows = this.state.results.datasets
          ? this.state.results.datasets.reduce((sum, d) => sum + ((d.data || []).length), 0)
          : ((this.state.results.data || []).length);
        this.setState({exportPreviewModal: {...payload, originalRows, finalRows: allRows.length}});
      }

      closeExportPreview() {
        this.setState({exportPreviewModal: null});
      }

      async exportData(format) {
        const payload = this.buildExportPayload();
        if (!payload) return;
        
        try {
          const response = await fetch(`/api/export/${format}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
          });
          
          if (response.ok) {
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const isMultiCsv = payload.datasets && payload.datasets.length && format === 'csv';
            a.download = `basira_scrape_${Date.now()}.${isMultiCsv ? 'zip' : (format === 'xlsx' ? 'xlsx' : format)}`;
            a.click();
            window.URL.revokeObjectURL(url);
          } else {
            this.showToast(this.isAR ? 'فشل التصدير. حاول مرة أخرى.' : 'Export failed. Please try again.', 'error');
          }
        } catch (e) {
          this.showToast(this.isAR ? 'فشل التصدير. تحقق من الاتصال.' : 'Export failed. Please check your connection.', 'error');
        }
      }
      

      async sendToBasira() {
        const {results} = this.state;
        if (!results) return;
        const rows = results.datasets
          ? results.datasets.flatMap(d => d.data || [])
          : (results.data || []);
        if (!rows.length) {
          this.showToast(this.isAR ? 'لم يتم استخراج أي بيانات.' : 'No data was extracted.', 'warning');
          return;
        }

        const cols = [...new Set(rows.flatMap(row => Object.keys(row || {})))];
        const csvLines = [cols.join(',')];
        rows.forEach(row => {
          csvLines.push(cols.map(c => {
            const v = String(row[c] ?? '').replace(/"/g, '""');
            return (v.includes(',') || v.includes('"') || v.indexOf('\n') >= 0) ? '"' + v + '"' : v;
          }).join(','));
        });
        const csv = '\ufeff' + csvLines.join('\r\n');

        this._showBridgeOverlay(this.isAR ? 'Bridge يُرسل البيانات إلى المعالجة المسبقة…' : 'Bridge sending data to Preprocessor…');
        try {
          const form = new FormData();
          form.append('file', new Blob([csv], {type:'text/csv;charset=utf-8'}), 'basira_scrape.csv');
          this._updateBridgeOverlay(this.isAR ? 'جاري رفع البيانات…' : 'Uploading data…', 30);
          const res = await fetch(BASIRA_CONFIG.PREPROCESSOR_URL, {method:'POST', body:form});
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          this._updateBridgeOverlay(this.isAR ? 'تمت المعالجة — جاري الانتقال…' : 'Processed — navigating…', 90);
          try {
            sessionStorage.setItem('basira_preprocess_result', JSON.stringify(data));
            sessionStorage.setItem('basira_data_source', 'web_scraping');
          } catch(e) {}
          if (BASIRA_CONFIG.POST_TO_PARENT) {
            try { window.opener?.postMessage({source:'basira-scraper',type:'scrape-complete',data}, '*'); } catch(e){}
            try { window.parent?.postMessage({source:'basira-scraper',type:'scrape-complete',data}, '*'); } catch(e){}
          }
          this._updateBridgeOverlay(this.isAR ? 'اكتمل النقل ✓' : 'Transfer complete ✓', 100);
          setTimeout(() => { window.location.href = 'http://127.0.0.1:5050'; }, 700);
        } catch(e) {
          this._hideBridgeOverlay();
          this.showToast(this.isAR ? 'فشل الإرسال. تحقق من الاتصال وأعد المحاولة.' : 'Send failed. Please check your connection and try again.', 'error');
        }
      }

      handleIframeSelector(selector, type) {
        if (!selector) return;
        if (type === 'container') {
          this.setState({containerSelector: selector});
        } else if (type === 'item') {
          this.setState({itemSelector: selector});
        } else if (type === 'field') {
          this.addVisualFieldToForm(selector);
        }
      }

      addVisualSelection(selection) {
        const selector = (selection && selection.selector || '').trim();
        if (!selector) return;
        const text = (selection && selection.text || '').trim().slice(0, 120);
        const tag = (selection && selection.tag || '').trim().toLowerCase();
        const visualId = (selection && selection.visualId || '').trim();
        const guessedType = tag === 'img' ? 'image' : tag === 'a' ? 'link' : 'text';
        const guessedName = this.makeFieldName(text || tag || 'field');
        const current = this.state.visualSelections || [];
        const exists = current.some(item => (visualId && item.visualId === visualId) || (!visualId && item.selector === selector));
        const next = exists ? current : [...current, {selector, text, tag, visualId, name: guessedName, type: guessedType}];
        this.setState({visualSelections: next});
        if (!exists) {
          setTimeout(() => {
            const side = document.getElementById('basira-visual-side');
            if (side) side.scrollTo({top: side.scrollHeight, behavior: 'smooth'});
          }, 30);
        }
      }

      makeFieldName(value) {
        const cleaned = String(value || 'field')
          .replace(/[^a-zA-Z0-9\u0600-\u06FF]+/g, ' ')
          .trim()
          .split(/\s+/)
          .slice(0, 3)
          .join('_');
        return cleaned || 'field';
      }

      updateVisualSelection(index, key, value) {
        const visualSelections = this.state.visualSelections || [];
        if (!visualSelections[index]) return;
        visualSelections[index][key] = value;
      }

      removeVisualSelection(index) {
        const visualSelections = (this.state.visualSelections || []).filter((_, i) => i !== index);
        this.setState({visualSelections});
      }

      clearVisualSelections() {
        this.setState({visualSelections: []});
      }

      addVisualFieldToForm(selector) {
        const fields = [...this.state.fields];
        const lastIndex = fields.length - 1;
        if (fields[lastIndex] && !fields[lastIndex].selector && !fields[lastIndex].name) {
          fields[lastIndex] = {name: 'field_' + fields.length, selector, type: 'text'};
        } else {
          fields.push({name: 'field_' + (fields.length + 1), selector, type: 'text'});
        }
        this.setState({fields});
      }

      applyVisualSelectionsToFields() {
        const selected = this.state.visualSelections || [];
        if (!selected.length) {
          this.showToast(this.isAR ? 'اختر حقلاً واحداً على الأقل باستخدام Shift+Click.' : 'Select at least one field using Shift+Click.', 'warning');
          return;
        }
        const newFields = selected.map((item, index) => ({
          name: item.name || ('field_' + (index + 1)),
          selector: item.selector,
          type: item.type || 'text'
        }));
        this.setState({fields: newFields, activeTab: 'scrape', visualMode: false});
      }

      getFilteredRows() {
        const {results, search, sortCol, sortDir} = this.state;
        if (!results) return [];
        
        const activeDataset = results.datasets ? results.datasets[this.state.selectedDatasetIndex || 0] : null;
        let rows = activeDataset ? activeDataset.data : results.data;
        
        // Filter by search
        if (search) {
          rows = rows.filter(row =>
            Object.values(row).some(val =>
              String(val).toLowerCase().includes(search.toLowerCase())
            )
          );
        }
        
        // Sort
        if (sortCol) {
          rows = [...rows].sort((a, b) => {
            const aVal = a[sortCol] || '';
            const bVal = b[sortCol] || '';
            const cmp = String(aVal).localeCompare(String(bVal));
            return sortDir === 'asc' ? cmp : -cmp;
          });
        }
        
        return rows;
      }

      injectVisualScript() {
        try {
          const iframe = document.getElementById('basira-visual-frame');
          if (!iframe || !iframe.contentWindow) return;

          const iframeDoc = iframe.contentWindow.document;
          if (iframeDoc.getElementById('basira-visual-style')) return;

          const style = iframeDoc.createElement('style');
          style.id = 'basira-visual-style';
          style.textContent = `
            html, body { overflow: auto !important; scroll-behavior: smooth; }
            .basira-visual-hover { outline: 2px dashed #38bdf8 !important; cursor: crosshair !important; }
            .basira-visual-selected { outline: 3px solid #22c55e !important; }
            .basira-visual-field { outline: 3px solid #f59e0b !important; }
            .basira-visual-toolbar {
              position: fixed; top: 8px; right: 8px; z-index: 2147483647;
              background: rgba(17,24,39,.94); color: #f1f5f9; padding: 8px; border-radius: 10px;
              box-shadow: 0 4px 16px rgba(0,0,0,.28); font-family: system-ui;
              width: 158px; border: 1px solid rgba(56,189,248,.28);
            }
            .basira-visual-btn {
              padding: 6px 7px; background: #38bdf8; color: white; border: none;
              border-radius: 7px; cursor: pointer; font-weight: 700; margin: 2px;
              font-size: 10px;
            }
            .basira-visual-btn.secondary { background: #1f2937; border: 1px solid #475569; }
            .basira-visual-btn.success { background: #22c55e; }
            .basira-visual-code { margin-top: 6px; padding: 7px; background: #1a2332; border-radius: 6px; font-size: 10px; font-family: monospace; color: #22c55e; word-break: break-all; line-height: 1.35; max-height:52px; overflow:auto; }
            .basira-visual-help { display:none; }
          `;
          iframeDoc.head.appendChild(style);

          const toolbar = iframeDoc.createElement('div');
          toolbar.className = 'basira-visual-toolbar';
          toolbar.innerHTML = `
            <div style="font-size:11px;font-weight:800;color:#38bdf8;margin-bottom:4px;">Selector</div>
            <div style="display:flex;flex-wrap:wrap;margin-bottom:4px;">
              <button type="button" class="basira-visual-btn success" id="basira-collect-toggle">Collect ON</button>
              <button type="button" class="basira-visual-btn secondary" id="basira-set-container">Container</button>
              <button type="button" class="basira-visual-btn secondary" id="basira-set-item">Item</button>
              <button type="button" class="basira-visual-btn success" id="basira-add-field">Add</button>
            </div>
            <div id="current-selector" class="basira-visual-code">No element selected</div>
            <div id="current-sample" style="display:none;"></div>
          `;
          iframeDoc.body.appendChild(toolbar);

          let currentElement = null;
          let currentSelector = null;
          let collectMode = true;
          let visualCounter = 0;

          const ensureVisualId = (el) => {
            if (!el) return '';
            let id = el.getAttribute('data-basira-visual-id');
            if (!id) {
              visualCounter += 1;
              id = 'bv-' + Date.now().toString(36) + '-' + visualCounter;
              el.setAttribute('data-basira-visual-id', id);
            }
            return id;
          };

          const notifyParent = (message) => {
            const payload = Object.assign({source: 'basira-visual'}, message || {});
            try {
              if (window.parent && typeof window.parent.basiraVisualBridge === 'function') {
                window.parent.basiraVisualBridge(payload);
                return;
              }
            } catch (e) {}
            try {
              window.parent.postMessage(payload, '*');
            } catch (e) {}
          };

          const isVisualReady = () => {
            try { return !!(window.parent && window.parent.app && window.parent.app.state && window.parent.app.state.visualPickerReady); }
            catch (e) { return false; }
          };

          const showWaitMessage = () => {
            const codeBox = iframeDoc.getElementById('current-selector');
            if (codeBox) codeBox.textContent = 'Please wait. Selection is not active yet.';
          };

          const cssEscape = (value) => {
            if (iframe.contentWindow.CSS && iframe.contentWindow.CSS.escape) return iframe.contentWindow.CSS.escape(value);
            return String(value).replace(/[^a-zA-Z0-9_-]/g, '\\$&');
          };

          const getSelector = (el) => {
            if (!el || !el.tagName) return '';
            if (el.closest('.basira-visual-toolbar')) return '';
            const tag = el.tagName.toLowerCase();
            if (el.id) return '#' + cssEscape(el.id);

            const preferredAttrs = ['data-testid', 'data-test', 'data-qa', 'itemprop', 'name'];
            for (const attr of preferredAttrs) {
              const val = el.getAttribute(attr);
              if (val && val.length < 60) {
                const selector = `${tag}[${attr}="${String(val).replace(/"/g, '\\"')}"]`;
                try {
                  if (iframeDoc.querySelectorAll(selector).length > 0) return selector;
                } catch (e) {}
              }
            }

            const classes = Array.from(el.classList || [])
              .filter(c => c && !c.startsWith('basira-visual') && !c.startsWith('basira-sel'))
              .slice(0, 3);
            if (classes.length) {
              const classSelector = '.' + classes.map(cssEscape).join('.');
              try {
                if (iframeDoc.querySelectorAll(classSelector).length >= 1) return classSelector;
              } catch (e) {}
              return tag + classSelector;
            }

            const parent = el.parentElement;
            if (!parent || parent === iframeDoc.body || parent === iframeDoc.documentElement) return tag;
            const siblings = Array.from(parent.children).filter(child => child.tagName === el.tagName);
            if (siblings.length > 1) return tag + ':nth-of-type(' + (siblings.indexOf(el) + 1) + ')';
            return tag;
          };

          const getSelectionPayload = () => {
            if (!currentElement || !currentSelector) return null;
            const tag = currentElement.tagName ? currentElement.tagName.toLowerCase() : '';
            let text = '';
            if (tag === 'img') {
              text = currentElement.getAttribute('alt') || currentElement.getAttribute('src') || '';
            } else {
              text = currentElement.innerText || currentElement.textContent || '';
            }
            return {selector: currentSelector, text: text.trim().replace(/\s+/g, ' '), tag, visualId: ensureVisualId(currentElement)};
          };

          const setCurrent = (el) => {
            if (!el || el.closest('.basira-visual-toolbar')) return;
            if (currentElement) currentElement.classList.remove('basira-visual-selected');
            currentElement = el;
            currentSelector = getSelector(el);
            currentElement.classList.add('basira-visual-selected');
            const codeBox = iframeDoc.getElementById('current-selector');
            const sampleBox = iframeDoc.getElementById('current-sample');
            codeBox.textContent = currentSelector || 'No selector';
            const payload = getSelectionPayload();
            sampleBox.textContent = payload && payload.text ? payload.text.slice(0, 150) : '';
          };

          iframeDoc.addEventListener('mouseover', (e) => {
            if (!isVisualReady()) return;
            if (e.target.closest('.basira-visual-toolbar')) return;
            e.target.classList.add('basira-visual-hover');
          }, true);

          iframeDoc.addEventListener('mouseout', (e) => {
            if (e.target && e.target.classList) e.target.classList.remove('basira-visual-hover');
          }, true);

          iframeDoc.addEventListener('click', (e) => {
            if (e.target.closest('.basira-visual-toolbar')) return;
            e.preventDefault();
            e.stopPropagation();
            if (!isVisualReady()) {
              showWaitMessage();
              return;
            }
            setCurrent(e.target);
            if (e.shiftKey || collectMode) {
              e.target.classList.add('basira-visual-field');
              const payload = getSelectionPayload();
              if (payload) notifyParent({action: 'add-field', payload});
            }
          }, true);

          iframeDoc.getElementById('basira-collect-toggle').addEventListener('click', () => {
            collectMode = !collectMode;
            const btn = iframeDoc.getElementById('basira-collect-toggle');
            btn.textContent = 'Collect ' + (collectMode ? 'ON' : 'OFF');
            btn.style.background = collectMode ? '#22c55e' : '#1f2937';
          });
          iframeDoc.getElementById('basira-set-container').addEventListener('click', () => {
            if (currentSelector) notifyParent({action: 'set-container', selector: currentSelector});
          });
          iframeDoc.getElementById('basira-set-item').addEventListener('click', () => {
            if (currentSelector) notifyParent({action: 'set-item', selector: currentSelector});
          });
          iframeDoc.getElementById('basira-add-field').addEventListener('click', () => {
            const payload = getSelectionPayload();
            if (payload) {
              if (currentElement) currentElement.classList.add('basira-visual-field');
              notifyParent({action: 'add-field', payload});
            }
          });

        } catch (error) {
          this.handleIframeError();
        }
      }
