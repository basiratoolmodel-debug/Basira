                    <span class="bs-stat-value" style="color:var(--purple);">${viewFields.length}</span>
                  </div>
                  <div class="bs-stat-row">
                    <span class="bs-stat-label">${t.totalCells}</span>
                    <span class="bs-stat-value" style="color:var(--success);">${totalCells}</span>
                  </div>
                  <div class="bs-stat-row">
                    <span class="bs-stat-label">${t.fillRate}</span>
                    <span class="bs-stat-value" style="color:${fillRate >= 80 ? 'var(--success)' : 'var(--warning)'};">${fillRate}%</span>
                  </div>
                </div>
              </div>
              
              <div style="margin-top:auto;">
                ${isPreview ? `<div style="font-size:.78rem;color:var(--warning);font-weight:800;margin-bottom:10px;line-height:1.5;">Preview mode shows only the first 5 rows. Return and start scraping for full export.</div>` : ''}
                <div class="bs-section-title">${t.export}</div>
                <div style="display:flex;flex-direction:column;gap:7px;">
                  <button class="bs-btn bs-btn-full" onclick="app.sendToBasira()"
                    style="background:linear-gradient(135deg,#0ea5e9,#6366f1);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(14,165,233,.3);margin-bottom:4px;">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    ${this.isAR ? 'إرسال للمعالجة ←' : 'Send to Preprocessor →'}
                  </button>
                  ${this.renderExportCleanOptions()}
                  <button class="bs-btn bs-btn-primary bs-btn-full" onclick="app.openExportPreview()">Export Preview</button>
                  ${this.renderExportFormatControls()}
                  <button class="bs-btn bs-btn-ghost bs-btn-full" onclick="app.setState({currentView:'home'})">${t.back}</button>
                </div>
              </div>
            </aside>
            
            <main class="bs-results-main">
              <div class="bs-search-row">
                <input class="bs-input bs-input-sm" type="text" placeholder="${t.search}..." 
                  value="${search}" oninput="app.setState({search:event.target.value})" 
                  style="flex:1;">
                <span class="bs-count-badge">${rows.length} / ${viewData.length}</span>
              </div>
              
              <div class="bs-table-wrap">
                <table class="bs-table">
                  <thead>
                    <tr>
                      <th style="width:40px;">#</th>
                      ${viewFields.map(f => `
                        <th onclick="app.setState({sortCol:'${f.name}',sortDir:app.state.sortCol==='${f.name}'&&app.state.sortDir==='asc'?'desc':'asc'})">
                          ${f.name}
                        </th>
                      `).join('')}
                    </tr>
                  </thead>
                  <tbody>
                    ${rows.length > 0 ? rows.map((row, i) => `
                      <tr>
                        <td style="color:var(--text-muted);font-family:var(--mono);font-size:.72rem;">${i + 1}</td>
                        ${viewFields.map(f => {
                          const val = row[f.name] || '';
                          if (f.type === 'link') {
                            return `<td><a href="${val}" target="_blank" style="color:var(--accent);text-decoration:none;word-break:break-all;">${val}</a></td>`;
                          } else if (f.type === 'image') {
                            return `<td>${val ? `<img src="${val}" style="max-width:100px;max-height:60px;border-radius:4px;">` : ''}</td>`;
                          } else {
                            return `<td style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${val}</td>`;
                          }
                        }).join('')}
                      </tr>
                    `).join('') : `
                      <tr><td colspan="${viewFields.length + 1}" class="bs-empty">${t.noResults}</td></tr>
                    `}
                  </tbody>
                </table>
              </div>
            </main>
          </div>
        `;
      }
      
      escapeHtml(value) {
        return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      getPaginationPresetOptions() {
        return [
          {value: '', label: 'Auto detect'},
          {value: 'a[rel="next"]', label: 'rel next link'},
          {value: 'link[rel="next"]', label: 'header next link'},
          {value: '.next a', label: '.next a'},
          {value: 'li.next a', label: 'li.next a'},
          {value: '.pagination .next a', label: '.pagination .next a'},
          {value: '.pagination a.next', label: '.pagination a.next'},
          {value: 'a.next', label: 'a.next'},
          {value: 'a[aria-label*="Next" i]', label: 'aria-label contains Next'},
          {value: 'a[title*="Next" i]', label: 'title contains Next'},
          {value: '__custom__', label: 'Custom selector'}
        ];
      }

      getPaginationPresetValue() {
        const current = String(this.state.paginationSelector || '').trim();
        const presetValues = this.getPaginationPresetOptions().filter(x => x.value !== '__custom__').map(x => x.value);
        if (!current) return '';
        return presetValues.includes(current) ? current : '__custom__';
      }

      handlePaginationPreset(value) {
        if (value === '__custom__') {
          this.setState({paginationSelector: this.state.paginationSelector || ''});
          return;
        }
        this.setState({paginationSelector: value});
      }

      renderPaginationSelectorControl() {
        const preset = this.getPaginationPresetValue();
        const isCustom = preset === '__custom__';
        const options = this.getPaginationPresetOptions().map(opt => `
          <option value="${this.escapeHtml(opt.value)}" ${preset === opt.value ? 'selected' : ''}>${this.escapeHtml(opt.label)}</option>
        `).join('');
        return `
          <div style="grid-column:1/-1;">
            <label class="bs-section-title" for="quick-pagination-preset">Next Page</label>
            <select id="quick-pagination-preset" name="quick-pagination-preset" class="bs-input" onchange="app.handlePaginationPreset(event.target.value)">
              ${options}
            </select>
            ${isCustom ? `
              <div style="margin-top:10px;">
                <label class="bs-section-title" for="quick-pagination-selector">Custom Next Selector</label>
                <input id="quick-pagination-selector" name="quick-pagination-selector" type="text" class="bs-input" placeholder="Example: .pager-next a" value="${this.escapeHtml(this.state.paginationSelector || '')}" oninput="app.setStateDraft('paginationSelector', event.target.value)">
              </div>
            ` : ''}
          </div>
        `;
      }

      renderExportFormatControls() {
        const isAR = this.isAR;
        const hasResults = this.state.results && (
          (this.state.results.data && this.state.results.data.length > 0) ||
          (this.state.results.datasets && this.state.results.datasets.length > 0)
        );
        if (!hasResults) return '';
        return `
          <div style="margin-top:10px;display:flex;flex-direction:column;gap:8px;">
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button class="bs-btn bs-btn-primary" onclick="app.exportData('csv')" style="flex:1;min-width:90px;">
                ${isAR ? 'تصدير CSV' : 'Export CSV'}
              </button>
              <button class="bs-btn" onclick="app.exportData('xlsx')" style="flex:1;min-width:90px;background:var(--surface-2,#f8fafc);color:var(--text);border:1.5px solid var(--border);border-radius:var(--r,12px);font-weight:700;cursor:pointer;">
                ${isAR ? 'تصدير Excel' : 'Export Excel'}
              </button>
            </div>
            <button onclick="app.sendToPreprocess()" style="width:100%;padding:10px 16px;background:linear-gradient(135deg,#0ea5e9,#6366f1);color:#fff;border:none;border-radius:var(--r,12px);font-weight:700;font-size:.84rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;">
              ${isAR ? '⟶ إرسال إلى المعالجة المسبقة' : '⟶ Send to Preprocess'}
            </button>
          </div>
        `;
      }

      async sendToPreprocess() {
        const results = this.state.results;
        if (!results) {
          this.showToast(this.isAR ? 'لا توجد بيانات للإرسال.' : 'No data to send.', 'error');
          return;
        }
        let fields, rows;
        if (results.datasets && results.datasets.length > 0) {
          fields = results.datasets[0].fields || [];
          rows = results.datasets.flatMap(d => d.data || []);
        } else {
          fields = results.fields || [];
          rows = results.data || [];
        }
        if (!rows.length) {
          this.showToast(this.isAR ? 'لا توجد بيانات للإرسال.' : 'No data to send.', 'error');
          return;
        }
        const headers = fields.map(f => f.name);
        const csvLines = [headers.join(',')];
        rows.forEach(row => {
          csvLines.push(headers.map(h => {
            const v = String(row[h] ?? '').replace(/"/g, '""');
            return (v.includes(',') || v.includes('"') || v.indexOf('\n') >= 0) ? '"' + v + '"' : v;
          }).join(','));
        });
        const csv = '\ufeff' + csvLines.join('\r\n');

        this._showBridgeOverlay(this.isAR ? 'Bridge يُرسل البيانات إلى المعالجة المسبقة…' : 'Bridge sending data to Preprocessor…');
        try {
          const form = new FormData();
          form.append('file', new Blob([csv], {type:'text/csv;charset=utf-8'}), 'basira_scrape.csv');
          this._updateBridgeOverlay(this.isAR ? 'جاري رفع البيانات…' : 'Uploading data…', 35);
          const res = await fetch('http://127.0.0.1:5050/upload-process', {method:'POST', body:form});
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          this._updateBridgeOverlay(this.isAR ? 'تمت المعالجة — جاري الانتقال…' : 'Processed — navigating…', 90);
          try {
            sessionStorage.setItem('basira_preprocess_result', JSON.stringify(data));
            sessionStorage.setItem('basira_data_source', 'web_scraping');
          } catch(e) {}
          this._updateBridgeOverlay(this.isAR ? 'اكتمل النقل ✓' : 'Transfer complete ✓', 100);
          setTimeout(() => { window.location.href = 'http://127.0.0.1:5050'; }, 700);
        } catch(e) {
          this._hideBridgeOverlay();
          this.showToast(this.isAR ? 'فشل الإرسال. تأكد أن التطبيق يعمل وأعد المحاولة.' : 'Send failed. Make sure the app is running and try again.', 'error');
        }
      }

      renderExportCleanOptions() {
        const opts = this.state.exportCleanOptions || {};
        const item = (key, label) => `
          <label style="display:flex;align-items:center;gap:8px;font-size:.74rem;color:var(--text-dim);line-height:1.35;cursor:pointer;">
            <input type="checkbox" ${opts[key] ? 'checked' : ''} onchange="app.toggleExportCleanOption('${key}')" style="accent-color:var(--accent);">
            <span>${label}</span>
          </label>
        `;
        return `
          <div style="border:1px solid var(--border);background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:7px;">
            <div style="font-size:.72rem;font-weight:900;color:var(--text);margin-bottom:2px;">Before export</div>
            ${item('trimSpaces', 'Trim spaces')}
            ${item('removeDuplicates', 'Remove duplicates')}
            ${item('removeEmptyRows', 'Remove empty rows')}
            ${item('normalizePrices', 'Normalize prices')}
            ${item('absoluteLinks', 'Convert relative links to absolute')}
          </div>
        `;
      }

      renderExportPreviewModal() {
        const modal = this.state.exportPreviewModal;
        if (!modal) return '';
        const rows = modal.datasets ? modal.datasets.flatMap(d => d.data || []) : (modal.rows || []);
        const fields = modal.fields || (modal.datasets && modal.datasets[0] ? modal.datasets[0].fields : []) || [];
        const sampleRows = rows.slice(0, 20);
        return `
          <div class="bs-modal-backdrop">
            <div class="bs-modal">
              <div class="bs-modal-head">
                <div>
                  <div class="bs-modal-title">Export Preview</div>
                  <div style="font-size:.78rem;color:var(--text-dim);margin-top:3px;">Rows after cleaning: ${modal.finalRows} of ${modal.originalRows}. Showing first ${sampleRows.length} rows.</div>
                </div>
                <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;">
                  <select class="bs-input bs-input-sm" style="width:130px;" onchange="app.setState({exportFormat:event.target.value})">
                    <option value="csv" ${(this.state.exportFormat || 'csv') === 'csv' ? 'selected' : ''}>CSV</option>
                    <option value="xlsx" ${(this.state.exportFormat || 'csv') === 'xlsx' ? 'selected' : ''}>Excel</option>
                    <option value="html" ${(this.state.exportFormat || 'csv') === 'html' ? 'selected' : ''}>HTML</option>
                  </select>
                  <button class="bs-btn bs-btn-primary" onclick="app.exportData(app.state.exportFormat || 'csv')" style="padding:8px 14px;">Download</button>
                  <button class="bs-btn bs-btn-ghost" onclick="app.closeExportPreview()" style="padding:8px 14px;">Back</button>
                </div>
              </div>
              <div class="bs-modal-body">
                ${modal.datasets ? `<div class="bs-inline-note" style="margin-bottom:12px;">Multi-site export: CSV downloads as ZIP, XLSX downloads with one sheet per website.</div>` : ''}
                <div class="bs-table-wrap">
                  <table class="bs-table">
                    <thead><tr><th style="width:46px;">#</th>${fields.map(f => `<th>${this.escapeHtml(f.name)}</th>`).join('')}</tr></thead>
                    <tbody>
                      ${sampleRows.length ? sampleRows.map((row, i) => `<tr><td>${i + 1}</td>${fields.map(f => `<td>${this.escapeHtml(row[f.name] ?? '')}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${fields.length + 1}" class="bs-empty">No rows after cleaning</td></tr>`}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      renderColumnEditorModal() {
        const modal = this.state.columnEditorModal;
        if (!modal) return '';
        const fields = this.getColumnEditorFields();
        const title = modal.mode === 'website'
          ? ((this.ensureWebsites()[modal.siteIndex] && this.ensureWebsites()[modal.siteIndex].name) || ('Website ' + (modal.siteIndex + 1)))
          : 'Current Website';
        return `
          <div class="bs-modal-backdrop">
            <div class="bs-modal">
              <div class="bs-modal-head">
                <div>
                  <div class="bs-modal-title">Edit Columns</div>
                  <div style="font-size:.78rem;color:var(--text-dim);margin-top:3px;">${this.escapeHtml(title)}. Rename columns, review selectors, change type, or remove fields you do not need.</div>
                </div>
                <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;">
                  <button type="button" class="bs-btn bs-btn-ghost" onclick="app.addColumnEditorField()" style="padding:8px 14px;">Add Column</button>
                  <button type="button" class="bs-btn bs-btn-primary" onclick="app.previewFromColumnEditor()" style="padding:8px 14px;">Preview</button>
                  <button type="button" class="bs-btn bs-btn-ghost" onclick="app.closeColumnEditor()" style="padding:8px 14px;">Back</button>
                </div>
              </div>
              <div class="bs-modal-body">
                <div class="bs-inline-note" style="margin-bottom:12px;">Columns with empty name or empty selector will not be used in scraping. Arabic column names and Arabic extracted text are supported.</div>
                <div class="bs-table-wrap">
                  <table class="bs-table">
                    <thead>
                      <tr>
                        <th style="width:46px;">#</th>
                        <th>Column Name</th>
                        <th>CSS Selector</th>
                        <th style="width:140px;">Type</th>
                        <th style="width:80px;">Remove</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${(fields && fields.length ? fields : [{name:'', selector:'', type:'text'}]).map((field, i) => `
                        <tr>
                          <td>${i + 1}</td>
                          <td><input class="bs-input bs-input-sm" value="${this.escapeHtml(field.name || '')}" placeholder="Column name" oninput="app.updateColumnEditorField(${i}, 'name', event.target.value)"></td>
                          <td><input class="bs-input bs-input-sm" value="${this.escapeHtml(field.selector || '')}" placeholder="CSS selector" oninput="app.updateColumnEditorField(${i}, 'selector', event.target.value)"></td>
                          <td>
                            <select class="bs-input bs-input-sm" onchange="app.updateColumnEditorField(${i}, 'type', event.target.value, true)">
                              <option value="text" ${field.type === 'text' ? 'selected' : ''}>Text</option>
                              <option value="link" ${field.type === 'link' ? 'selected' : ''}>Link</option>
                              <option value="image" ${field.type === 'image' ? 'selected' : ''}>Image</option>
                              <option value="price" ${field.type === 'price' ? 'selected' : ''}>Price</option>
                            </select>
                          </td>
                          <td><button type="button" class="bs-field-remove" onclick="app.removeColumnEditorField(${i})">×</button></td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      renderPreviewModal() {
        const modal = this.state.previewModal;
        const loading = this.state.previewModalLoading;
        if (!modal && !loading) return '';
        if (loading) {
          return `
            <div class="bs-modal-backdrop">
              <div class="bs-modal" style="max-width:520px;">
                <div class="bs-modal-head">
                  <div class="bs-modal-title">Preview</div>
                  <button class="bs-btn bs-btn-ghost" onclick="app.closePreviewModal()" style="padding:7px 12px;">Back</button>
                </div>
                <div class="bs-modal-body" style="text-align:center;padding:42px 20px;">
                  <div class="bs-spinner"></div>
                  <div style="font-weight:900;margin-top:16px;">Loading preview...</div>
                  <div style="color:var(--text-dim);font-size:.86rem;margin-top:6px;">Basira is reading the fields you selected.</div>
                </div>
              </div>
            </div>
          `;
        }
        const rows = modal.data || [];
        const fields = modal.fields || [];
        return `
          <div class="bs-modal-backdrop">
            <div class="bs-modal">
              <div class="bs-modal-head">
                <div>
                  <div class="bs-modal-title">Preview</div>
                  <div style="font-size:.78rem;color:var(--text-dim);margin-top:3px;">First ${rows.length} rows from the selected fields.</div>
                </div>
                <div style="display:flex;gap:8px;align-items:center;">
                  <button class="bs-btn bs-btn-primary" onclick="app.closePreviewModal(); app.startScrape(false);" style="padding:8px 14px;">Start Scraping</button>
                  <button class="bs-btn bs-btn-ghost" onclick="app.closePreviewModal()" style="padding:8px 14px;">Back</button>
                </div>
              </div>
              <div class="bs-modal-body">
                <div class="bs-table-wrap">
                  <table class="bs-table">
                    <thead><tr><th style="width:46px;">#</th>${fields.map(f => `<th>${this.escapeHtml(f.name)}</th>`).join('')}</tr></thead>
                    <tbody>
                      ${rows.map((row, i) => `<tr><td>${i + 1}</td>${fields.map(f => `<td>${this.escapeHtml(row[f.name] ?? '')}</td>`).join('')}</tr>`).join('')}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      render() {
        const {currentView} = this.state;
        let html = '';
        
        if (currentView === 'home') html = this.renderHome();
        else if (currentView === 'loading') html = this.renderLoading();
        else if (currentView === 'results') html = this.renderResults();
        
        document.getElementById('app').innerHTML = html + this.renderColumnEditorModal() + this.renderPreviewModal() + this.renderExportPreviewModal();
        this.fixFormAccessibility();
      }

      fixFormAccessibility() {
        document.querySelectorAll('input, select, textarea').forEach((el, index) => {
          if (!el.id) el.id = 'basira-field-' + index;
          if (!el.name) el.name = el.id;
          if (!el.getAttribute('aria-label')) {
            const label = el.closest('div')?.querySelector('label')?.textContent?.trim();
            el.setAttribute('aria-label', label || el.placeholder || el.name || 'form field');
          }
        });
      }
    }
    
    // Initialize app
    let app;
    document.addEventListener('DOMContentLoaded', () => {
      app = new BasiraApp();
      window.app = app;
      // Sync lang/theme from Basira settings server
      fetch('http://127.0.0.1:5001/api/settings', {cache: 'no-store'})
        .then(r => r.json())
        .then(d => {
          if (d.status === 'ok' && app) {
            const lang  = d.language || app.state.lang;
            const theme = d.theme    || app.state.theme;
            app.setState({lang, theme});
            document.documentElement.setAttribute('lang', lang);
            document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
            document.documentElement.setAttribute('data-theme', theme);
            try { localStorage.setItem('basira_lang', lang); } catch(e) {}
            try { localStorage.setItem('basira_theme', theme); } catch(e) {}
          }
        }).catch(() => {});
      // Re-sync on tab focus
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState !== 'visible' || !app) return;
        fetch('http://127.0.0.1:5001/api/settings', {cache: 'no-store'})
          .then(r => r.json())
          .then(d => {
            if (d.status === 'ok') {
              const lang  = d.language || app.state.lang;
              const theme = d.theme    || app.state.theme;
              app.setState({lang, theme});
              document.documentElement.setAttribute('lang', lang);
              document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
              document.documentElement.setAttribute('data-theme', theme);
              try { localStorage.setItem('basira_lang', lang); } catch(e) {}
              try { localStorage.setItem('basira_theme', theme); } catch(e) {}
            }
          }).catch(() => {});
      });
    });
    </script>
</body>
</html>
