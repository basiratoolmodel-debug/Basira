name = "basira-scraper-worker"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ── Browser Rendering binding ─────────────────────────────────────────────
[browser]
binding = "MYBROWSER"

# ── KV Namespace for job storage & history ────────────────────────────────
# After creating: wrangler kv namespace create SCRAPER_KV
# Replace the id values below with the ones wrangler prints
[[kv_namespaces]]
binding = "SCRAPER_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_YOUR_KV_PREVIEW_ID"

# ── Routes ────────────────────────────────────────────────────────────────
# Uncomment and adjust after deploying Pages:
# [[routes]]
# pattern = "scraper.yourdomain.workers.dev"
# zone_name = "yourdomain.com"

# ── Worker limits ─────────────────────────────────────────────────────────
[limits]
cpu_ms = 30000
