<!doctype html>
<html lang="ar" dir="rtl" data-lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Basira | تسجيل الدخول</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="auth-ui.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>

    <style>
      .subscription-wrap {
        margin-top: 18px;
      }

      .subscription-alert {
        border: 1px solid rgba(220, 38, 38, 0.16);
        background: #fff7f7;
        border-radius: 18px;
        padding: 18px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
      }

      .subscription-alert__header {
        margin-bottom: 14px;
      }

      .subscription-alert__title {
        margin: 0 0 6px;
        font-size: 1rem;
        color: #991b1b;
      }

      .subscription-alert__subtitle {
        margin: 0;
        color: #7f1d1d;
        line-height: 1.8;
        font-size: 0.95rem;
      }

      .subscription-alert__grid {
        display: grid;
        gap: 12px;
        margin-bottom: 16px;
      }

      .subscription-alert__item {
        background: #ffffff;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 14px;
        padding: 12px 14px;
      }

      .subscription-alert__label {
        display: block;
        font-size: 0.82rem;
        color: #64748b;
        margin-bottom: 4px;
      }

      .subscription-alert__value {
        color: #0f172a;
        font-size: 0.96rem;
      }

      .subscription-alert__button {
        width: 100%;
      }
    </style>
  </head>

  <body class="auth">
    <header class="topbar">
      <div class="container topbar__inner">
        <a class="brand" href="./index.html" aria-label="Basira Home">
          <span class="brand__mark" aria-hidden="true">B</span>
          <span class="brand__text">Basira</span>
        </a>

        <div class="actions">
          <button class="lang" id="langBtn" type="button" aria-label="Toggle language">
            <span class="lang__dot" aria-hidden="true"></span>
            <span id="langLabel">AR</span>
          </button>
        </div>
      </div>
    </header>

    <main class="auth__main">
      <div class="container auth__grid">
        <section class="panel" aria-label="Login panel">
          <h1 class="auth__title">تسجيل الدخول</h1>

          <form class="form" id="loginForm" novalidate>
            <label class="field">
              <span class="field__label">البريد الإلكتروني</span>
              <input
                class="input"
                id="email"
                type="email"
                name="email"
                placeholder="name@domain.com"
                required
              />
            </label>

            <label class="field">
              <span class="field__label">كلمة المرور</span>
              <input
                class="input"
                id="password"
                type="password"
                name="password"
                placeholder="••••••••"
                required
              />
            </label>

            <button class="btn btn--primary btn--lg" type="submit">
              تسجيل الدخول
            </button>

            <p class="muted auth__hint">
              لا تملك حسابًا؟
              <a href="./register.html">إنشاء حساب جديد</a>
            </p>
          </form>

          <div class="note" id="loginMessage" role="status" aria-live="polite"></div>
          <div class="subscription-wrap" id="subscriptionNotice" hidden></div>
        </section>
      </div>
    </main>

    <div class="popup-backdrop" id="loginSuccessPopup">
      <div class="popup">
        <div class="popup__icon">✓</div>
        <h2 class="popup__title">تم تسجيل الدخول بنجاح</h2>
        <p class="popup__text" id="loginSuccessPopupText">
          سيتم تحويلك الآن إلى بصيرة.
        </p>
      </div>
    </div>

    <script>
      const langBtn = document.getElementById("langBtn");
      const langLabel = document.getElementById("langLabel");

      langBtn.addEventListener("click", () => {
        const html = document.documentElement;
        const isAr = (html.getAttribute("lang") || "ar") === "ar";
        if (isAr) {
          html.setAttribute("lang", "en");
          html.setAttribute("dir", "ltr");
          langLabel.textContent = "EN";
        } else {
          html.setAttribute("lang", "ar");
          html.setAttribute("dir", "rtl");
          langLabel.textContent = "AR";
        }
      });
    </script>
  </body>
</html>
